<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="fastapiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1726" />
      <stop offset="50%" stop-color="#141E33" />
      <stop offset="100%" stop-color="#0B111D" />
    </linearGradient>
    <linearGradient id="fastapiAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#009688" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <pattern id="fastapiGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#fastapiBg)" />
  <rect width="800" height="500" fill="url(#fastapiGrid)" />

  <!-- Outer Card Frame -->
  <rect x="25" y="25" width="750" height="450" rx="16" fill="none" stroke="#1E293B" stroke-width="2" />
  
  <!-- Header Bar -->
  <rect x="25" y="25" width="750" height="60" rx="16" fill="#131C2E" />
  <circle cx="55" cy="55" r="6" fill="#EF4444" />
  <circle cx="75" cy="55" r="6" fill="#F59E0B" />
  <circle cx="95" cy="55" r="6" fill="#10B981" />
  
  <rect x="120" y="42" width="340" height="26" rx="6" fill="#0B111D" />
  <text x="135" y="59" font-family="'DM Mono', monospace" font-size="12" fill="#94A3B8">fastapi-chassis.internal/v1/architecture</text>
  
  <rect x="620" y="42" width="135" height="26" rx="6" fill="#064E3B" />
  <text x="635" y="59" font-family="'DM Mono', monospace" font-size="11" font-weight="700" fill="#34D399">● CLEAN ARCH</text>

  <!-- Watermark / Title -->
  <text x="50" y="130" font-family="'Bricolage Grotesque', system-ui, sans-serif" font-size="28" font-weight="800" fill="#F8FAFC">ENTERPRISE FASTAPI CHASSIS</text>
  <text x="50" y="155" font-family="'Inter', sans-serif" font-size="13" fill="#059669" font-weight="600">Domain-Driven Design (DDD) · Transactional Outbox · RFC 7807 · Structlog</text>

  <!-- Architecture Boxes (Onion Architecture Representation) -->
  <!-- Layer 1: API / Ingress -->
  <rect x="50" y="180" width="215" height="150" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
  <rect x="62" y="195" width="70" height="20" rx="4" fill="#009688" />
  <text x="70" y="209" font-family="'DM Mono', monospace" font-size="10" font-weight="700" fill="#FFFFFF">LAYER 01</text>
  <text x="62" y="235" font-family="'Bricolage Grotesque', system-ui" font-size="16" font-weight="700" fill="#F1F5F9">API Ingress &amp; Auth</text>
  <text x="62" y="258" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8">• Fast routes &amp; Pydantic v2</text>
  <text x="62" y="278" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8">• RFC 7807 Problem Details</text>
  <text x="62" y="298" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8">• Distributed Idempotency</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 275 255 L 290 255" stroke="#059669" stroke-width="2.5" stroke-linecap="round" />
  <polygon points="295,255 288,250 288,260" fill="#059669" />

  <!-- Layer 2: Core Domain -->
  <rect x="300" y="180" width="215" height="150" rx="10" fill="#132724" stroke="#059669" stroke-width="2" />
  <rect x="312" y="195" width="70" height="20" rx="4" fill="#059669" />
  <text x="320" y="209" font-family="'DM Mono', monospace" font-size="10" font-weight="700" fill="#FFFFFF">LAYER 02</text>
  <text x="312" y="235" font-family="'Bricolage Grotesque', system-ui" font-size="16" font-weight="700" fill="#34D399">Pure Core Domain</text>
  <text x="312" y="258" font-family="'Inter', sans-serif" font-size="12" fill="#A7F3D0">• Zero framework deps</text>
  <text x="312" y="278" font-family="'Inter', sans-serif" font-size="12" fill="#A7F3D0">• Domain Events &amp; Invariants</text>
  <text x="312" y="298" font-family="'Inter', sans-serif" font-size="12" fill="#A7F3D0">• 100% Pytest Coverage</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 525 255 L 540 255" stroke="#059669" stroke-width="2.5" stroke-linecap="round" />
  <polygon points="545,255 538,250 538,260" fill="#059669" />

  <!-- Layer 3: Infrastructure & Outbox -->
  <rect x="550" y="180" width="200" height="150" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
  <rect x="562" y="195" width="70" height="20" rx="4" fill="#3B82F6" />
  <text x="570" y="209" font-family="'DM Mono', monospace" font-size="10" font-weight="700" fill="#FFFFFF">LAYER 03</text>
  <text x="562" y="235" font-family="'Bricolage Grotesque', system-ui" font-size="16" font-weight="700" fill="#F1F5F9">Outbox &amp; Storage</text>
  <text x="562" y="258" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8">• Transactional Outbox</text>
  <text x="562" y="278" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8">• Async SQLAlchemy / PG</text>
  <text x="562" y="298" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8">• Kafka Event Publisher</text>

  <!-- Bottom Visual Placeholder Callout Badge -->
  <rect x="50" y="360" width="700" height="90" rx="12" fill="#0F172A" stroke="#009688" stroke-dasharray="6,4" stroke-width="1.5" />
  <text x="75" y="395" font-family="'DM Mono', monospace" font-size="13" font-weight="700" fill="#34D399">📷 VISUAL MEDIA PLACEHOLDER: ENTERPRISE FASTAPI CHASSIS ARCHITECTURE</text>
  <text x="75" y="422" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8">Target location for project screenshot, live API dashboard, or terminal benchmark. Place visual artifact here.</text>
</svg>
