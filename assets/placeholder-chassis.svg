<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2DCD2" stroke-width="0.8"/>
    </pattern>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#16130F"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="#FDFBF7"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <rect x="15" y="15" width="770" height="470" rx="10" fill="none" stroke="#16130F" stroke-width="2.5"/>

  <!-- Badge / Header -->
  <rect x="35" y="35" width="290" height="34" rx="6" fill="#E5484F" filter="url(#shadow)"/>
  <text x="50" y="58" font-family="'DM Mono', monospace" font-size="13" font-weight="600" fill="#FFFFFF">SYSTEM BLUEPRINT · 03 INFRA CHASSIS</text>

  <text x="35" y="105" font-family="'Bricolage Grotesque', sans-serif" font-size="24" font-weight="800" fill="#16130F">Enterprise Microservice Chassis</text>
  <text x="35" y="128" font-family="'DM Mono', monospace" font-size="12" fill="#6F6A62">Transactional Outbox Pattern → Atomic DB Writes → Async Relay Worker</text>

  <!-- Flowchart Diagram -->
  <!-- Node 1: Incoming Event -->
  <g transform="translate(45, 170)">
    <rect width="190" height="150" rx="8" fill="#FFFFFF" stroke="#16130F" stroke-width="2" filter="url(#shadow)"/>
    <rect x="12" y="12" width="75" height="20" rx="4" fill="#FEE2E2"/>
    <text x="18" y="26" font-family="'DM Mono', monospace" font-size="10" font-weight="600" fill="#B91C1C">MUTATION</text>
    <text x="12" y="58" font-family="'Bricolage Grotesque', sans-serif" font-size="16" font-weight="700" fill="#16130F">Service Boundary</text>
    <text x="12" y="80" font-family="'DM Mono', monospace" font-size="11" fill="#4F4A42">• FastAPI endpoints</text>
    <text x="12" y="98" font-family="'DM Mono', monospace" font-size="11" fill="#4F4A42">• Pydantic v2 schemas</text>
    <text x="12" y="116" font-family="'DM Mono', monospace" font-size="11" fill="#4F4A42">• RFC 7807 problem details</text>
    <text x="12" y="138" font-family="'DM Mono', monospace" font-size="10" font-weight="600" fill="#B91C1C">🛡️ ZERO UNTYPED I/O</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 245 245 L 290 245" stroke="#16130F" stroke-width="2.5" fill="none"/>
  <polygon points="295,245 285,240 285,250" fill="#16130F"/>

  <!-- Node 2: Atomic Transaction & Outbox -->
  <g transform="translate(305, 170)">
    <rect width="210" height="150" rx="8" fill="#FFFFFF" stroke="#16130F" stroke-width="2" filter="url(#shadow)"/>
    <rect x="12" y="12" width="95" height="20" rx="4" fill="#DCFCE7"/>
    <text x="18" y="26" font-family="'DM Mono', monospace" font-size="10" font-weight="600" fill="#15803D">ATOMIC OUTBOX</text>
    <text x="12" y="58" font-family="'Bricolage Grotesque', sans-serif" font-size="16" font-weight="700" fill="#16130F">PostgreSQL DB</text>
    <text x="12" y="80" font-family="'DM Mono', monospace" font-size="11" fill="#4F4A42">• Entity State Table</text>
    <text x="12" y="98" font-family="'DM Mono', monospace" font-size="11" fill="#4F4A42">• Outbox Events Table</text>
    <text x="12" y="116" font-family="'DM Mono', monospace" font-size="11" fill="#4F4A42">• Committed in single txn</text>
    <text x="12" y="138" font-family="'DM Mono', monospace" font-size="10" font-weight="600" fill="#15803D">✨ 0 DUAL-WRITE BUGS</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 525 245 L 565 245" stroke="#16130F" stroke-width="2.5" fill="none"/>
  <polygon points="575,245 565,240 565,250" fill="#16130F"/>

  <!-- Node 3: Background Relay Worker -->
  <g transform="translate(585, 170)">
    <rect width="170" height="150" rx="8" fill="#FFFFFF" stroke="#16130F" stroke-width="2" filter="url(#shadow)"/>
    <rect x="12" y="12" width="90" height="20" rx="4" fill="#FEF9C3"/>
    <text x="18" y="26" font-family="'DM Mono', monospace" font-size="10" font-weight="600" fill="#A16207">RELAY WORKER</text>
    <text x="12" y="58" font-family="'Bricolage Grotesque', sans-serif" font-size="16" font-weight="700" fill="#16130F">Kafka Relay</text>
    <text x="12" y="80" font-family="'DM Mono', monospace" font-size="11" fill="#4F4A42">• Polls outbox table</text>
    <text x="12" y="98" font-family="'DM Mono', monospace" font-size="11" fill="#4F4A42">• Emits to Kafka broker</text>
    <text x="12" y="116" font-family="'DM Mono', monospace" font-size="11" fill="#4F4A42">• Redis distributed locks</text>
    <text x="12" y="138" font-family="'DM Mono', monospace" font-size="10" font-weight="600" fill="#A16207">📦 100% DELIVERY</text>
  </g>

  <!-- Bottom Stamp / Metadata -->
  <rect x="45" y="360" width="710" height="85" rx="6" fill="#F4EFE6" stroke="#16130F" stroke-width="1.5"/>
  <text x="65" y="390" font-family="'DM Mono', monospace" font-size="11" font-weight="600" fill="#16130F">[IMAGE PLACEHOLDER] Enterprise Chassis Template &amp; Transactional Outbox Specs</text>
  <text x="65" y="412" font-family="'DM Mono', monospace" font-size="10.5" fill="#6F6A62">Engineered by Vaibhav Rastogi · Replace with high-res architecture screenshots when available.</text>
  <text x="65" y="430" font-family="'DM Mono', monospace" font-size="10" font-weight="600" fill="#E5484F">VERIFIED: Modular Microservice Scaffolding · GitHub: vaibhav2616</text>
</svg>

