<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0D1322" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <!-- Outer Frame -->
  <rect x="24" y="24" width="1152" height="627" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4" />

  <!-- Top Header / Title Bar -->
  <rect x="44" y="44" width="1112" height="64" rx="10" fill="#111827" stroke="#1F2937" stroke-width="1.5" />
  <circle cx="70" cy="76" r="6" fill="#EF4444" />
  <circle cx="90" cy="76" r="6" fill="#F59E0B" />
  <circle cx="110" cy="76" r="6" fill="#10B981" />
  <text x="135" y="81" font-family="'DM Mono', monospace" font-size="14" font-weight="600" fill="#94A3B8">ML PIPELINE ARCHITECTURE // CASE 04: INSURANCE PREMIUM PREDICTION</text>
  
  <rect x="940" y="58" width="200" height="36" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.2" />
  <text x="1040" y="81" text-anchor="middle" font-family="'DM Mono', monospace" font-size="12" font-weight="600" fill="#34D399">R² = 0.87 · VERIFIED</text>

  <!-- 3 Main Architecture Columns -->
  <!-- Col 1: Feature Ingestion & Preprocessing -->
  <g transform="translate(44, 130)">
    <rect width="340" height="400" rx="12" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.2" />
    <rect x="16" y="16" width="308" height="38" rx="6" fill="#1E293B" />
    <text x="30" y="40" font-family="'Bricolage Grotesque', sans-serif" font-size="15" font-weight="700" fill="#38BDF8">01. Multi-Factor Ingestion</text>

    <!-- Features Pill List -->
    <g transform="translate(16, 70)">
      <rect width="308" height="48" rx="8" fill="#0F172A" stroke="#1E293B" />
      <text x="16" y="28" font-family="'DM Mono', monospace" font-size="12" fill="#E2E8F0">Age, BMI &amp; Vital Biometrics</text>
      <text x="16" y="42" font-family="'DM Mono', monospace" font-size="10" fill="#64748B">Continuous feature scaling (RobustScaler)</text>
    </g>
    <g transform="translate(16, 130)">
      <rect width="308" height="48" rx="8" fill="#0F172A" stroke="#1E293B" />
      <text x="16" y="28" font-family="'DM Mono', monospace" font-size="12" fill="#E2E8F0">Smoker &amp; Lifestyle Habits</text>
      <text x="16" y="42" font-family="'DM Mono', monospace" font-size="10" fill="#64748B">Binary risk factor encoding (Weight: 3.4x)</text>
    </g>
    <g transform="translate(16, 190)">
      <rect width="308" height="48" rx="8" fill="#0F172A" stroke="#1E293B" />
      <text x="16" y="28" font-family="'DM Mono', monospace" font-size="12" fill="#E2E8F0">Dependents, Region &amp; Tier</text>
      <text x="16" y="42" font-family="'DM Mono', monospace" font-size="10" fill="#64748B">One-Hot Encoding + Geocoded risk bands</text>
    </g>
    <g transform="translate(16, 250)">
      <rect width="308" height="48" rx="8" fill="#0F172A" stroke="#1E293B" />
      <text x="16" y="28" font-family="'DM Mono', monospace" font-size="12" fill="#E2E8F0">Interaction Terms &amp; BMI x Smoker</text>
      <text x="16" y="42" font-family="'DM Mono', monospace" font-size="10" fill="#64748B">Non-linear feature cross engineering</text>
    </g>

    <!-- Col 1 Footer -->
    <rect x="16" y="320" width="308" height="60" rx="8" fill="#134E4A" fill-opacity="0.3" stroke="#0D9488" stroke-width="1" stroke-dasharray="4,3" />
    <text x="30" y="346" font-family="'DM Mono', monospace" font-size="11" font-weight="600" fill="#2DD4BF">PREPROCESSING PIPELINE</text>
    <text x="30" y="364" font-family="'DM Mono', monospace" font-size="10" fill="#99F6E4">ColumnTransformer + Sklearn Pipeline</text>
  </g>

  <!-- Flow Arrow 1 to 2 -->
  <path d="M 390 330 L 424 330" stroke="#10B981" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrow)" />

  <!-- Col 2: Machine Learning Regression Core -->
  <g transform="translate(430, 130)">
    <rect width="340" height="400" rx="12" fill="url(#boxGrad)" stroke="#10B981" stroke-width="1.8" filter="url(#glow)" />
    <rect width="340" height="400" rx="12" fill="url(#boxGrad)" stroke="#10B981" stroke-width="1.5" />
    <rect x="16" y="16" width="308" height="38" rx="6" fill="#064E3B" />
    <text x="30" y="40" font-family="'Bricolage Grotesque', sans-serif" font-size="15" font-weight="700" fill="#6EE7B7">02. Predictive ML Engine</text>

    <!-- Metric Badges inside Col 2 -->
    <g transform="translate(16, 70)">
      <rect width="146" height="74" rx="8" fill="#022C22" stroke="#059669" stroke-width="1.2" />
      <text x="20" y="30" font-family="'DM Mono', monospace" font-size="10" fill="#A7F3D0">ACCURACY SCORE</text>
      <text x="20" y="58" font-family="'Bricolage Grotesque', sans-serif" font-size="28" font-weight="800" fill="#34D399">0.87</text>
      <text x="82" y="58" font-family="'DM Mono', monospace" font-size="13" font-weight="700" fill="#10B981">R²</text>
    </g>
    <g transform="translate(178, 70)">
      <rect width="146" height="74" rx="8" fill="#022C22" stroke="#059669" stroke-width="1.2" />
      <text x="20" y="30" font-family="'DM Mono', monospace" font-size="10" fill="#A7F3D0">IMPROVEMENT</text>
      <text x="20" y="58" font-family="'Bricolage Grotesque', sans-serif" font-size="28" font-weight="800" fill="#34D399">+22%</text>
      <text x="96" y="58" font-family="'DM Mono', monospace" font-size="11" font-weight="600" fill="#10B981">vs Base</text>
    </g>

    <!-- Algorithms Evaluated -->
    <g transform="translate(16, 160)">
      <rect width="308" height="135" rx="8" fill="#0F172A" stroke="#1E293B" />
      <text x="16" y="24" font-family="'DM Mono', monospace" font-size="11" font-weight="600" fill="#94A3B8">MODEL TOURNAMENT RESULTS:</text>
      
      <text x="16" y="50" font-family="'DM Mono', monospace" font-size="11" fill="#34D399">✔ Gradient Boosting Regressor · R² = 0.872</text>
      <rect x="16" y="58" width="276" height="4" rx="2" fill="#047857" />
      
      <text x="16" y="82" font-family="'DM Mono', monospace" font-size="11" fill="#94A3B8">· Random Forest Regressor · R² = 0.841</text>
      <rect x="16" y="90" width="220" height="4" rx="2" fill="#334155" />
      
      <text x="16" y="114" font-family="'DM Mono', monospace" font-size="11" fill="#64748B">· Baseline Multiple Linear Reg · R² = 0.750</text>
      <rect x="16" y="122" width="170" height="4" rx="2" fill="#1E293B" />
    </g>

    <!-- Col 2 Footer -->
    <rect x="16" y="320" width="308" height="60" rx="8" fill="#065F46" fill-opacity="0.3" stroke="#10B981" stroke-width="1" stroke-dasharray="4,3" />
    <text x="30" y="346" font-family="'DM Mono', monospace" font-size="11" font-weight="600" fill="#34D399">HYPERPARAMETER TUNED</text>
    <text x="30" y="364" font-family="'DM Mono', monospace" font-size="10" fill="#A7F3D0">K-Fold Cross-Validation (5-fold, min MAE)</text>
  </g>

  <!-- Flow Arrow 2 to 3 -->
  <path d="M 776 330 L 810 330" stroke="#6366F1" stroke-width="2.5" stroke-dasharray="5,3" />

  <!-- Col 3: Deployment & Presentation (FastAPI + Streamlit + Docker) -->
  <g transform="translate(816, 130)">
    <rect width="340" height="400" rx="12" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.2" />
    <rect x="16" y="16" width="308" height="38" rx="6" fill="#1E293B" />
    <text x="30" y="40" font-family="'Bricolage Grotesque', sans-serif" font-size="15" font-weight="700" fill="#818CF8">03. FastAPI + Streamlit Deploy</text>

    <!-- API & Dashboard Nodes -->
    <g transform="translate(16, 70)">
      <rect width="308" height="74" rx="8" fill="#1E1B4B" stroke="#4338CA" stroke-width="1.2" />
      <text x="16" y="26" font-family="'DM Mono', monospace" font-size="11" font-weight="700" fill="#A5B4FC">FASTAPI ASYNC INFERENCE NODE</text>
      <text x="16" y="46" font-family="'Bricolage Grotesque', sans-serif" font-size="20" font-weight="800" fill="#C7D2FE">&lt; 150ms <tspan font-size="12" font-family="'DM Mono', monospace" fill="#818CF8">latency</tspan></text>
      <text x="16" y="64" font-family="'DM Mono', monospace" font-size="10" fill="#94A3B8">1000+ requests served · 30% lower latency</text>
    </g>

    <g transform="translate(16, 160)">
      <rect width="308" height="74" rx="8" fill="#0F172A" stroke="#1E293B" />
      <text x="16" y="26" font-family="'DM Mono', monospace" font-size="11" font-weight="700" fill="#38BDF8">STREAMLIT INTERACTIVE UI</text>
      <text x="16" y="46" font-family="'Bricolage Grotesque', sans-serif" font-size="20" font-weight="800" fill="#E2E8F0">Live Inputs <tspan font-size="12" font-family="'DM Mono', monospace" fill="#38BDF8">&amp; Sliders</tspan></text>
      <text x="16" y="64" font-family="'DM Mono', monospace" font-size="10" fill="#94A3B8">Tested by 10+ users with instant visual quote</text>
    </g>

    <g transform="translate(16, 250)">
      <rect width="308" height="50" rx="8" fill="#0F172A" stroke="#1E293B" />
      <text x="16" y="28" font-family="'DM Mono', monospace" font-size="11" font-weight="700" fill="#FBBF24">DOCKER CONTAINERIZATION</text>
      <text x="16" y="44" font-family="'DM Mono', monospace" font-size="10" fill="#94A3B8">Reproducible multi-stage build &amp; instant spinup</text>
    </g>

    <!-- Col 3 Footer -->
    <rect x="16" y="320" width="308" height="60" rx="8" fill="#312E81" fill-opacity="0.3" stroke="#6366F1" stroke-width="1" stroke-dasharray="4,3" />
    <text x="30" y="346" font-family="'DM Mono', monospace" font-size="11" font-weight="600" fill="#A5B4FC">PRODUCTION CONTAINER</text>
    <text x="30" y="364" font-family="'DM Mono', monospace" font-size="10" fill="#C7D2FE">Python 3.11 + Uvicorn + Streamlit</text>
  </g>

  <!-- Bottom Callout Badge: Visual Placeholder Indicator -->
  <g transform="translate(44, 550)">
    <rect width="1112" height="74" rx="10" fill="#111827" stroke="#059669" stroke-width="1.5" stroke-dasharray="6,4" />
    <text x="24" y="34" font-family="'DM Mono', monospace" font-size="13" font-weight="700" fill="#34D399">[MEDIA PLACEHOLDER: CASE 04 SHOWCASE CANVAS]</text>
    <text x="24" y="55" font-family="'Bricolage Grotesque', sans-serif" font-size="13" fill="#94A3B8">Ready for interactive Streamlit dashboard screenshots, SHAP feature importance curves, and FastAPI Swagger docs.</text>
    
    <rect x="910" y="18" width="180" height="38" rx="6" fill="#10B981" />
    <text x="1000" y="42" text-anchor="middle" font-family="'Bricolage Grotesque', sans-serif" font-size="12" font-weight="700" fill="#064E3B">vaibhav2616/ML-Deploy</text>
  </g>
</svg>
